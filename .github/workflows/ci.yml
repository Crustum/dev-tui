name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                bun: [latest]
        steps:
            - uses: actions/checkout@v7
              with:
                  persist-credentials: false
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ matrix.bun }}
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run build
            - run: bun test
